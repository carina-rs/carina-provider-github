[package]
name = "carina-provider-github"
version.workspace = true
edition = "2024"
license = "MIT"
description = "GitHub provider for Carina infrastructure management tool"
repository = "https://github.com/carina-rs/carina-provider-github"
homepage = "https://github.com/carina-rs/carina-provider-github"

[lib]
doctest = false

[[bin]]
name = "carina-provider-github"
path = "src/main.rs"

[dependencies]
carina-plugin-sdk = { workspace = true }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
carina-core = { workspace = true, features = ["test-utils", "provider-host"] }
