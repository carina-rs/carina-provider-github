name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.event_name == 'push'
    uses: carina-rs/provider-release/.github/workflows/build.yml@23f693069e0481ce3d49a6d55d1a0658ea113917
    with:
      provider: carina-provider-github
      name: github
      namespace: carina-rs
      docs-generate: |
        ./scripts/generate-docs.sh
        docs_status=$(git status --porcelain -- generated-docs)
        if ! git diff --exit-code || [ -n "$docs_status" ]; then
          if [ -n "$docs_status" ]; then
            printf '%s\n' "$docs_status"
          fi
          echo "::error::Committed docs do not match the exported provider schemas. Run './scripts/generate-docs.sh' locally and commit the regenerated generated-docs/."
          exit 1
        fi

  release:
    name: Create Release
    needs: [build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: carina-rs/provider-release/github-release@23f693069e0481ce3d49a6d55d1a0658ea113917
        with:
          provider: carina-provider-github

  publish:
    name: Publish to Carina Registry
    needs: [release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Publish to Carina Registry
        # Signing/publish intentionally stay in this job so OIDC job_workflow_ref and the
        # Fulcio SAN remain this release.yml (the registry's trusted-publisher policy points
        # here); bump the SHA only after reviewing the provider-release diff.
        uses: carina-rs/provider-release/publish@23f693069e0481ce3d49a6d55d1a0658ea113917
        with:
          provider: carina-provider-github
          name: github
          namespace: carina-rs

  yank:
    name: Yank from Carina Registry
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Yank from Carina Registry
        uses: carina-rs/provider-release/yank@23f693069e0481ce3d49a6d55d1a0658ea113917
        with:
          name: github
          namespace: carina-rs
