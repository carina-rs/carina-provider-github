[workspace]
members = [
    "carina-provider-github",
    "carina-provider-github-docgen",
]
default-members = ["carina-provider-github"]
resolver = "3"

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
carina-plugin-sdk = { git = "https://github.com/carina-rs/carina", rev = "6c5c0c5401b3f8cb0f42330d3cc855bf57426898" }
carina-docgen = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "34db16e84edafb26a936f3a4e34ab17e75759715" }
