[workspace]
members = [
    "carina-provider-github",
    "carina-provider-github-docgen",
]
default-members = ["carina-provider-github"]
resolver = "3"

[workspace.package]
version = "0.2.0"

[workspace.dependencies]
carina-plugin-sdk = { git = "https://github.com/carina-rs/carina", rev = "bd0361fe6e77dc75cd20036518b668aa83f00df9" }
carina-docgen = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "361fae898964672af93499b3dc563f410e5b7f0c" }
