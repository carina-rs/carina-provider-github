[workspace]
members = [
    "carina-provider-github",
    "carina-provider-github-docgen",
]
default-members = ["carina-provider-github"]
resolver = "3"

[workspace.package]
version = "0.3.0"

[workspace.dependencies]
carina-plugin-sdk = { git = "https://github.com/carina-rs/carina", rev = "ea66ae7a157bd6e28f374f80286a29eb8d77a557" }
carina-core = { git = "https://github.com/carina-rs/carina", rev = "ea66ae7a157bd6e28f374f80286a29eb8d77a557" }
carina-docgen = { git = "https://github.com/carina-rs/carina-provider-aws", rev = "eaac7a40eecaa56231f174bf9d98357411b08241" }
